basePath: /
definitions:
  dto.AccountLoginDTO:
    properties:
      captchaId:
        description: 图形验证码id
        type: string
      captchaValue:
        description: 图形验证码
        type: string
      password:
        description: 登录密码
        type: string
      username:
        description: 登录帐号
        type: string
    required:
    - captchaId
    - captchaValue
    - password
    - username
    type: object
  dto.CreateSysResourcesDTO:
    properties:
      description:
        description: 描述
        type: string
      icon:
        description: 菜单小图标
        type: string
      isCache:
        description: 是否缓存:1表示缓存:2不缓存
        type: integer
      isHidden:
        description: 是否隐藏:1表示不隐藏,2表示隐藏
        type: integer
      isLink:
        description: 是否为外部链接:1表示不是,2表示是
        type: integer
      method:
        description: 接口的请求方式
        type: string
      parentId:
        description: 上一级id，0=顶级
        type: integer
      resourcesType:
        description: 类型:1表示目录,2表示菜单,3表示接口
        type: integer
      sort:
        description: 菜单,或按钮排序
        type: integer
      status:
        description: 状态1是正常,2是禁用
        enum:
        - 1
        - 2
        type: integer
      title:
        description: 名称:按钮标题,或菜单标题
        type: string
      uRL:
        description: 按钮请求url,或菜单路由
        type: string
    required:
    - title
    - uRL
    type: object
  dto.CreateSysRoleDTO:
    properties:
      description:
        description: 描述
        type: string
      name:
        description: 角色名称
        type: string
      resourcesIdList:
        description: 资源id
        items:
          type: integer
        minItems: 1
        type: array
      sort:
        description: 排序
        type: integer
      status:
        description: 状态1是正常,2是禁用
        enum:
        - 1
        - 2
        type: integer
    required:
    - name
    - resourcesIdList
    type: object
  dto.GetSysAccountPageDTO:
    properties:
      email:
        description: 邮箱
        type: string
      mobile:
        description: 手机号
        type: string
      pageNumber:
        type: integer
      pageSize:
        type: integer
      status:
        description: 状态1是正常,2是禁用
        type: integer
      username:
        description: 登录帐号
        type: string
    type: object
  dto.ModifyCurrentPasswordDTO:
    properties:
      confirmPassword:
        maxLength: 16
        minLength: 6
        type: string
      newPassword:
        maxLength: 16
        minLength: 6
        type: string
      password:
        maxLength: 16
        minLength: 6
        type: string
    required:
    - confirmPassword
    - newPassword
    - password
    type: object
  dto.PageSysResourcesDTO:
    properties:
      pageNumber:
        type: integer
      pageSize:
        type: integer
      parentId:
        description: 上一级id
        type: integer
      status:
        description: 状态0是正常,1是禁用
        type: integer
      title:
        description: 名称:按钮标题,或菜单标题
        type: string
    type: object
  dto.ResetPasswordDTO:
    properties:
      confirmPassword:
        maxLength: 16
        minLength: 6
        type: string
      id:
        description: 主键id
        type: integer
      password:
        maxLength: 16
        minLength: 6
        type: string
    required:
    - confirmPassword
    - id
    - password
    type: object
  dto.RolePageDTO:
    properties:
      name:
        description: 角色名称
        type: string
      pageNumber:
        type: integer
      pageSize:
        type: integer
      status:
        description: 状态1是正常,2是禁用
        type: integer
    type: object
  dto.VerifyCaptchaDTO:
    properties:
      captchaId:
        description: 图形验证码id
        type: string
      captchaValue:
        description: 图形验证码
        type: string
    required:
    - captchaId
    - captchaValue
    type: object
  gin-admin-api_internal_api_account_dto.CreateSysAccountDTO:
    properties:
      avatar:
        description: 头像
        type: string
      confirmPassword:
        description: 确定密码
        maxLength: 16
        minLength: 6
        type: string
      email:
        description: 邮箱
        type: string
      mobile:
        description: 手机号
        type: string
      password:
        description: 登录密码
        maxLength: 16
        minLength: 6
        type: string
      roleIdList:
        description: 授权的角色id
        items:
          type: integer
        minItems: 1
        type: array
      username:
        description: 登录帐号
        type: string
    required:
    - confirmPassword
    - password
    - roleIdList
    - username
    type: object
  gin-admin-api_internal_api_account_dto.ModifySysAccountDTO:
    properties:
      avatar:
        description: 头像
        type: string
      email:
        description: 邮箱
        type: string
      id:
        description: 主键id
        minimum: 1
        type: integer
      mobile:
        description: 手机号
        type: string
      roleIdList:
        description: 授权的角色id
        items:
          type: integer
        minItems: 1
        type: array
      status:
        description: 状态1是正常,2是禁用
        enum:
        - 1
        - 2
        type: integer
      username:
        description: 登录帐号
        type: string
    required:
    - id
    - roleIdList
    - status
    - username
    type: object
  gin-admin-api_internal_api_account_vo.SysAccountVO:
    properties:
      avatar:
        description: 头像
        type: string
      createdAt:
        description: 创建时间
        type: integer
      createdBy:
        description: 创建人
        type: integer
      email:
        description: 邮箱
        type: string
      id:
        description: 主键id
        type: integer
      isAdmin:
        description: 1是超级管理员，2是普通管理员
        type: integer
      lastLoginDate:
        description: 最后一次登录时间
        type: integer
      lastLoginIP:
        description: 最后一次登录ip
        type: string
      mobile:
        description: 手机号
        type: string
      password:
        description: 登录密码
        type: string
      status:
        description: 状态1是正常,2是禁用
        type: integer
      updatedAt:
        description: 更新时间
        type: integer
      updatedBy:
        description: 更新人
        type: integer
      username:
        description: 登录帐号
        type: string
    type: object
  vo.AccountLoginVO:
    properties:
      email:
        description: 邮箱
        type: string
      id:
        description: 主键id
        type: integer
      isAdmin:
        description: 1是超级管理员，2是普通管理员
        type: integer
      lastLoginDate:
        description: 最后一次登录时间
        type: integer
      lastLoginIp:
        description: 最后一次登录ip
        type: string
      mobile:
        description: 手机号
        type: string
      token:
        description: token
        type: string
      username:
        description: 登录帐号
        type: string
    type: object
  vo.GetCaptchaVO:
    properties:
      base64:
        description: base64
        type: string
      captchaId:
        description: 唯一码
        type: string
      code:
        description: 验证码
        type: string
    type: object
  vo.MenusVO:
    properties:
      icon:
        description: 菜单小图标
        type: string
      id:
        description: 主键id
        type: integer
      isCache:
        description: 是否缓存:1表示缓存:2不缓存
        type: integer
      isHidden:
        description: 是否隐藏:1表示不隐藏,2表示隐藏
        type: integer
      isLink:
        description: 是否为外部链接:1表示不是,2表示是
        type: integer
      parentId:
        description: 上一级id
        type: integer
      resourcesType:
        description: 类型:1表示目录,2表示菜单,3表示接口
        type: integer
      sort:
        description: 菜单,或按钮排序
        type: integer
      title:
        description: 名称:按钮标题,或菜单标题
        type: string
      url:
        description: 按钮请求url,或菜单路由
        type: string
    type: object
  vo.ResourcesVO:
    properties:
      id:
        description: 主键id
        type: integer
      parentId:
        description: 上一级id
        type: integer
      sort:
        description: 菜单,或按钮排序
        type: integer
      title:
        description: 名称:按钮标题,或菜单标题
        type: string
    type: object
  vo.SysAccountDetailVO:
    properties:
      avatar:
        description: 头像
        type: string
      createdAt:
        description: 创建时间
        type: integer
      createdBy:
        description: 创建人
        type: integer
      email:
        description: 邮箱
        type: string
      id:
        description: 主键id
        type: integer
      isAdmin:
        description: 1是超级管理员，2是普通管理员
        type: integer
      lastLoginDate:
        description: 最后一次登录时间
        type: integer
      lastLoginIP:
        description: 最后一次登录ip
        type: string
      mobile:
        description: 手机号
        type: string
      password:
        description: 登录密码
        type: string
      roleIdList:
        description: 授权的角色id
        items:
          type: integer
        type: array
      status:
        description: 状态1是正常,2是禁用
        type: integer
      updatedAt:
        description: 更新时间
        type: integer
      updatedBy:
        description: 更新人
        type: integer
      username:
        description: 登录帐号
        type: string
    type: object
  vo.SysResourcesVO:
    properties:
      createdAt:
        description: 创建时间
        type: integer
      description:
        description: 描述
        type: string
      hasChildren:
        description: 是否有子节点
        type: boolean
      icon:
        description: 菜单小图标
        type: string
      id:
        description: 主键id
        type: integer
      isAdminHave:
        description: 是否超管独有,1表示是,0表示不是
        type: integer
      isCache:
        description: 是否缓存:1表示缓存:2不缓存
        type: integer
      isHidden:
        description: 是否隐藏:1表示不隐藏,2表示隐藏
        type: integer
      isLink:
        description: 是否为外部链接:1表示不是,2表示是
        type: integer
      method:
        description: 接口的请求方式
        type: string
      parentId:
        description: 上一级id，0=顶级
        type: integer
      resourcesType:
        description: 类型:1表示目录,2表示菜单,3表示接口
        type: integer
      sort:
        description: 菜单,或按钮排序
        type: integer
      status:
        description: 状态1是正常,2是禁用
        type: integer
      title:
        description: 名称:按钮标题,或菜单标题
        type: string
      updatedAt:
        description: 更新时间
        type: integer
      url:
        description: 按钮请求url,或菜单路由
        type: string
    type: object
  vo.SysRoleDetailVO:
    properties:
      createdAt:
        description: 创建时间
        type: integer
      description:
        description: 描述
        type: string
      id:
        description: 主键id
        type: integer
      name:
        description: 角色名称
        type: string
      resourcesIdList:
        description: 授权的资源id
        items:
          type: integer
        type: array
      sort:
        description: 排序
        type: integer
      status:
        description: 状态1是正常,2是禁用
        type: integer
      updatedAt:
        description: 更新时间
        type: integer
    type: object
  vo.SysRoleVO:
    properties:
      createdAt:
        description: 创建时间
        type: integer
      description:
        description: 描述
        type: string
      id:
        description: 主键id
        type: integer
      name:
        description: 角色名称
        type: string
      sort:
        description: 排序
        type: integer
      status:
        description: 状态1是正常,2是禁用
        type: integer
      updatedAt:
        description: 更新时间
        type: integer
    type: object
info:
  contact: {}
  description: gin-admin-api 后台管理接口文档
  title: gin-admin-api
  version: "1.0"
paths:
  /api/v1/admin/account/{id}:
    delete:
      consumes:
      - application/json
      description: 根据账号 ID 删除账号，已分配角色的账号不能直接删除
      parameters:
      - description: 账号ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            type: string
      summary: 删除账号
      tags:
      - 账号中心
    get:
      consumes:
      - application/json
      description: 根据账号 ID 获取账号详情
      parameters:
      - description: 账号ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 统一响应，code=0 时 result 为 vo.SysAccountDetailVO，code=1 时 result
            为 null
          schema:
            $ref: '#/definitions/vo.SysAccountDetailVO'
      summary: 获取账号详情
      tags:
      - 账号中心
  /api/v1/admin/account/list:
    get:
      consumes:
      - application/json
      description: 根据查询条件获取账号列表
      parameters:
      - description: 登录账号
        in: query
        name: username
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 账号列表
          schema:
            items:
              $ref: '#/definitions/gin-admin-api_internal_api_account_vo.SysAccountVO'
            type: array
      summary: 获取账号列表
      tags:
      - 账号中心
  /api/v1/admin/account/modify/{id}:
    put:
      consumes:
      - application/json
      description: 根据账号 ID 修改账号基础信息和角色关系
      parameters:
      - description: 账号ID
        in: path
        name: id
        required: true
        type: integer
      - description: 修改账号参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/gin-admin-api_internal_api_account_dto.ModifySysAccountDTO'
      produces:
      - application/json
      responses:
        "200":
          description: 修改成功
          schema:
            type: string
      summary: 修改账号
      tags:
      - 账号中心
  /api/v1/admin/account/modifyCurrentPassword:
    post:
      consumes:
      - application/json
      description: 修改当前登录账号密码
      parameters:
      - description: 修改当前账号密码参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.ModifyCurrentPasswordDTO'
      produces:
      - application/json
      responses:
        "200":
          description: 修改当前账号密码成功
          schema:
            type: string
      summary: 修改当前账号密码
      tags:
      - 账号中心
  /api/v1/admin/account/page:
    post:
      consumes:
      - application/json
      description: 根据查询条件分页获取账号列表
      parameters:
      - description: 分页查询参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.GetSysAccountPageDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/gin-admin-api_internal_api_account_vo.SysAccountVO'
            type: array
      summary: 分页获取账号
      tags:
      - 账号中心
  /api/v1/admin/account/register:
    post:
      consumes:
      - application/json
      description: 创建后台账号，并分配角色关系
      parameters:
      - description: 创建账号参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/gin-admin-api_internal_api_account_dto.CreateSysAccountDTO'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            type: string
      summary: 创建账号
      tags:
      - 账号中心
  /api/v1/admin/account/resetPassword/{id}:
    post:
      consumes:
      - application/json
      description: 根据账号 ID 重置账号密码
      parameters:
      - description: 账号ID
        in: path
        name: id
        required: true
        type: integer
      - description: 重置密码参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordDTO'
      produces:
      - application/json
      responses:
        "200":
          description: 重置密码成功
          schema:
            type: string
      summary: 重置账号密码
      tags:
      - 账号中心
  /api/v1/admin/auth/captcha:
    get:
      consumes:
      - application/json
      description: 生成图形验证码，返回验证码图片 Base64、验证码 ID 和验证码值
      produces:
      - application/json
      responses:
        "200":
          description: 统一响应，code=0 时 result 为 vo.GetCaptchaVO，code=1 时 result 为 null
          schema:
            $ref: '#/definitions/vo.GetCaptchaVO'
      summary: 获取图形验证码图片
      tags:
      - 认证中心
  /api/v1/admin/auth/captcha/verify:
    post:
      consumes:
      - application/json
      description: 根据验证码 ID 和验证码值校验图形验证码
      parameters:
      - description: 验证码参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyCaptchaDTO'
      produces:
      - application/json
      responses:
        "200":
          description: 验证码成功
          schema:
            type: string
      summary: 验证图形验证码
      tags:
      - 认证中心
  /api/v1/admin/auth/login:
    post:
      consumes:
      - application/json
      description: 使用账号、邮箱或手机号登录，登录成功后返回账号信息和 token
      parameters:
      - description: 登录参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.AccountLoginDTO'
      produces:
      - application/json
      responses:
        "200":
          description: 统一响应，code=0 时 result 为 vo.AccountLoginVO，code=1 时 result 为
            null
          schema:
            $ref: '#/definitions/vo.AccountLoginVO'
      summary: 账号登录
      tags:
      - 认证中心
  /api/v1/admin/auth/logout:
    post:
      consumes:
      - application/json
      description: 删除当前登录用户的 token 缓存
      parameters:
      - description: 登录 token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 退出登录成功
          schema:
            type: string
      summary: 用户退出登录
      tags:
      - 认证中心
  /api/v1/admin/menu:
    get:
      consumes:
      - application/json
      description: 获取当前登录账号可访问的菜单资源列表，超级管理员返回全部正常资源
      produces:
      - application/json
      responses:
        "200":
          description: 菜单列表
          schema:
            items:
              $ref: '#/definitions/vo.MenusVO'
            type: array
      summary: 获取菜单
      tags:
      - 菜单中心
  /api/v1/admin/resources:
    post:
      consumes:
      - application/json
      description: 创建目录、菜单或接口资源
      parameters:
      - description: 创建资源参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.CreateSysResourcesDTO'
      produces:
      - application/json
      responses:
        "200":
          description: 操作成功
          schema:
            type: string
      summary: 创建资源
      tags:
      - 资源中心
  /api/v1/admin/resources/{id}:
    delete:
      consumes:
      - application/json
      description: 根据资源 ID 删除资源；存在子资源或已被角色绑定时不能删除
      parameters:
      - description: 资源ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 操作成功
          schema:
            type: string
      summary: 删除资源
      tags:
      - 资源中心
    put:
      consumes:
      - application/json
      description: 根据资源 ID 修改目录、菜单或接口资源
      parameters:
      - description: 资源ID
        in: path
        name: id
        required: true
        type: integer
      - description: 修改资源参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.CreateSysResourcesDTO'
      produces:
      - application/json
      responses:
        "200":
          description: 操作成功
          schema:
            type: string
      summary: 修改资源
      tags:
      - 资源中心
  /api/v1/admin/resources/catalog:
    get:
      consumes:
      - application/json
      description: 根据资源类型获取当前账号可访问的目录、菜单或接口资源
      parameters:
      - description: 资源类型:1只查询模块,2查询模块和菜单,3查询模块、菜单、按钮
        in: query
        name: catalogType
        type: integer
      produces:
      - application/json
      responses:
