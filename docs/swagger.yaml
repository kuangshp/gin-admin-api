info:
  contact: {}
  description: gin-admin-api 后台管理接口文档
  title: gin-admin-api
  version: "1.0"
paths:
  /api/v1/admin/account:
    post:
      consumes:
      - application/json
      description: 创建后台账号，并分配角色、岗位关系；deptId 为账号所属部门，postIdList 第一个岗位为主岗
      parameters:
      - description: 创建账号参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.CreateSysAccountDTO'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            type: string
      summary: 创建账号
      tags:
      - 账号中心
  /api/v1/admin/account/{id}:
    delete:
      consumes:
      - application/json
      description: 根据账号 ID 删除账号，并清理账号角色、岗位关系
      parameters:
      - description: 账号ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            type: string
      summary: 删除账号
      tags:
      - 账号中心
    put:
      consumes:
      - application/json
